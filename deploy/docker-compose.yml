services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bchat
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ../server
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://bchat:${POSTGRES_PASSWORD}@db:5432/bchat
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_ORIGIN: https://${DOMAIN}
      UPLOAD_DIR: /data/uploads
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      RATE_LIMIT_ENABLED: "true"
      DISK_MIN_FREE_BYTES: "5368709120"
    volumes:
      - uploads:/data/uploads
    depends_on:
      - db
    restart: unless-stopped

  edge:
    build:
      context: ..
      dockerfile: deploy/edge.Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy-data:
  caddy-config:
